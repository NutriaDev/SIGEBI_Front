<div class="max-w-2xl mx-auto p-4 sm:p-6">
  <div class="bg-white rounded-lg shadow">
    <div class="bg-primary text-white font-semibold px-4 py-2 rounded-t-lg">
      Busqueda
    </div>

    <div class="p-6 space-y-4">
      <!-- BUSCAR POR NOMBRE -->
      <div>
        <label class="block text-sm font-semibold mb-1">
          Buscar por Nombre
        </label>

        <div class="flex flex-col sm:flex-row gap-3 mt-4">
          <input
            type="text"
            [(ngModel)]="searchText"
            placeholder="Ej: UCI"
            class="w-full border border-gray-300 rounded-md px-3 py-2"
          />

          <button
            (click)="searchClasificationByName()"
            class="bg-primary text-white px-4 py-2 rounded-md w-full sm:w-auto"
          >
            Buscar
          </button>
        </div>
      </div>

      <!-- BUSCAR POR ID -->
      <div>
        <label class="block text-sm font-semibold mb-1"> Buscar por ID </label>

        <div class="flex flex-col sm:flex-row gap-3 mt-4">
          <input
            type="number"
            [(ngModel)]="searchId"
            placeholder="Ej: 1"
            class="w-full border border-gray-300 rounded-md px-3 py-2"
          />

          <button
            (click)="searchClasificationById()"
            class="bg-primary text-white px-4 py-2 rounded-md w-full sm:w-auto"
          >
            Buscar
          </button>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 mt-4">
        <button
          class="bg-primary text-white px-4 py-2 rounded w-full sm:w-auto"
        >
          Clasificación de Equipos
        </button>

        <button
          class="bg-primary-400 text-white px-4 py-2 rounded w-full sm:w-auto"
        >
          Crear una clasificación
        </button>

        <button
          class="bg-primary-200 text-white px-4 py-2 rounded w-full sm:w-auto"
        >
          Actualizar una clasificación
        </button>
      </div>

      <div class="mt-6">
        <!-- LISTADO -->
        <div *ngIf="viewMode === 'list'">
          <h3 class="font-semibold mb-3">Áreas actuales</h3>

          <div
            *ngFor="let classification of classifications"
            class="flex justify-between border-b py-2"
          >
            <span>{{ classification.name }}</span>

            <button
              class="text-primary text-sm w-full sm:w-auto"
              (click)="selectClassification(classification)"
            >
              Editar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
