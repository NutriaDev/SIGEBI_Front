<div class="max-w-2xl mx-auto p-6">
  <div class="bg-white rounded-lg shadow">
    <div class="bg-primary text-white font-semibold px-4 py-2 rounded-t-lg">
      Busqueda
    </div>

    <div class="p-6 space-y-4">
      <!-- BUSCAR POR NOMBRE -->
      <div>
        <label class="block text-sm font-semibold mb-1">
          Buscar por Nombre
        </label>

        <div class="flex gap-3">
          <input
            type="text"
            [(ngModel)]="searchText"
            placeholder="Ej: UCI"
            class="w-full border border-gray-300 rounded-md px-3 py-2"
          />

          <button
            (click)="searchAreaByName()"
            class="bg-primary text-white px-4 py-2 rounded-md"
          >
            Buscar
          </button>
        </div>
      </div>

      <!-- BUSCAR POR ID -->
      <div>
        <label class="block text-sm font-semibold mb-1"> Buscar por ID </label>

        <div class="flex gap-3">
          <input
            type="number"
            [(ngModel)]="searchId"
            placeholder="Ej: 1"
            class="w-full border border-gray-300 rounded-md px-3 py-2"
          />

          <button
            (click)="searchAreaById()"
            class="bg-primary text-white px-4 py-2 rounded-md"
          >
            Buscar
          </button>
        </div>
      </div>

      <div class="flex gap-3 mt-4">
        <button
          class="bg-primary text-white px-4 py-2 rounded"
          (click)="showAreas()"
        >
          Areas Actuales
        </button>

        <button
          class="bg-gray-400 text-white px-4 py-2 rounded"
          (click)="showCreate()"
        >
          Crear un Area
        </button>

        <button
          class="bg-gray-600 text-white px-4 py-2 rounded"
          (click)="showUpdate()"
        >
          Actualizar un area
        </button>
      </div>

      <div class="mt-6">
        <!-- LISTADO -->
        <div *ngIf="viewMode === 'list'">
          <h3 class="font-semibold mb-3">Áreas actuales</h3>

          <div
            *ngFor="let area of areas"
            class="flex justify-between border-b py-2"
          >
            <span>{{ area.name }}</span>

            <button class="text-blue-500" (click)="selectArea(area)">
              Editar
            </button>
          </div>
        </div>

        <!-- CREAR AREA -->
        <div *ngIf="viewMode === 'create'" class="mt-4">
          <h3 class="font-semibold mb-2">Crear nueva área</h3>

          <input
            [(ngModel)]="newAreaName"
            placeholder="Nombre del área"
            class="border p-2 rounded w-full"
          />

          <button
            class="bg-primary text-white px-4 py-2 rounded mt-3"
            (click)="createArea()"
            [disabled]="loading"
          >
            {{ loading ? "Guardando..." : "Guardar Área" }}
          </button>
        </div>

        <!-- ACTUALIZAR / DESACTIVAR -->
        <div *ngIf="viewMode === 'update' && selectedArea" class="mt-4">
          <h3 class="font-semibold mb-2">Actualizar Área</h3>

          <input
            [(ngModel)]="selectedArea.name"
            class="border p-2 rounded w-full"
          />

          <div class="flex items-center gap-3 mt-3">
            <button
              class="bg-primary text-white px-4 py-2 rounded"
              (click)="updateArea()"
            >
              Actualizar
            </button>

            <button
              (click)="toggleAreaStatus()"
              class="px-4 py-2 rounded text-white"
              [ngClass]="
                selectedArea.active
                  ? 'bg-red-500 hover:bg-red-600'
                  : 'bg-green-500 hover:bg-green-600'
              "
            >
              {{ selectedArea.active ? "Desactivar Área" : "Activar Área" }}
            </button>

            <span
              class="text-xs px-2 py-1 rounded"
              [ngClass]="
                selectedArea.active
                  ? 'bg-green-500 text-white'
                  : 'bg-red-500 text-white'
              "
            >
              {{ selectedArea.active ? "Activa" : "Inactiva" }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
