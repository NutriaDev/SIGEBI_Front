<div
  class="min-h-screen bg-secondary flex flex-col items-center justify-center px-4"
>
  <!-- Title -->
  <h1 class="text-4xl font-bold text-primary tracking-wide mb-3">SIGEBI</h1>
  <p class="text-text-muted text-sm mb-10">Restablece tu contraseña</p>

  <!-- Card -->
  <div class="w-full max-w-md space-y-5">
    <p class="text-text-muted text-sm text-center leading-relaxed">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer
      tu contraseña.
    </p>

    <!-- Email -->
    <div>
      <input
        type="email"
        class="input-field"
        placeholder="Correo electrónico*"
        [(ngModel)]="email"
        name="email"
      />
    </div>

    <!-- Enviar -->
    <div class="pt-2">
      <button
        class="btn-primary text-base tracking-wide w-full"
        [disabled]="loading"
        (click)="onSubmit()"
      >
        <span *ngIf="!loading">Enviar enlace</span>
        <span *ngIf="loading">Enviando...</span>
      </button>
    </div>

    <!-- Volver al login -->
    <div class="text-center pt-2">
      <a
        routerLink="/auth/login"
        class="text-text-muted italic text-sm hover:text-primary transition-colors duration-200"
      >
        Volver al inicio de sesión
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="w-full max-w-xl flex justify-between items-center mt-16 px-4">
    <span class="text-sm italic text-text-muted">Version 1.0.0</span>
    <a
      href="#"
      class="text-sm italic text-text-muted hover:text-primary transition-colors duration-200"
    >
      ¿Necesito ayuda?
    </a>
  </div>
</div>
