<div
  class="min-h-screen bg-secondary flex flex-col items-center justify-center px-4"
>
  <!-- Title -->
  <h1 class="text-4xl font-bold text-primary tracking-wide mb-3">SIGEBI</h1>
  <p class="text-text-muted text-sm mb-10">Crea tu nueva contraseña</p>

  <!-- Card -->
  <div class="w-full max-w-md space-y-5">
    <p class="text-text-muted text-sm text-center leading-relaxed">
      La contraseña debe tener mínimo 8 caracteres, una mayúscula, un número y
      un carácter especial.
    </p>

    <!-- Nueva contraseña -->
    <div class="relative">
      <input
        [type]="showPassword ? 'text' : 'password'"
        class="input-field pr-12"
        placeholder="Nueva contraseña*"
        [(ngModel)]="newPassword"
        name="newPassword"
      />
      <button
        type="button"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors"
        (click)="togglePassword()"
      >
        <span *ngIf="!showPassword">👁</span>
        <span *ngIf="showPassword">🙈</span>
      </button>
    </div>

    <!-- Confirmar contraseña -->
    <div class="relative">
      <input
        [type]="showConfirmPassword ? 'text' : 'password'"
        class="input-field pr-12"
        placeholder="Confirmar contraseña*"
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
      />
      <button
        type="button"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors"
        (click)="toggleConfirmPassword()"
      >
        <span *ngIf="!showConfirmPassword">👁</span>
        <span *ngIf="showConfirmPassword">🙈</span>
      </button>
    </div>

    <!-- Indicador de coincidencia -->
    <div
      *ngIf="confirmPassword"
      class="text-sm text-center"
      [class.text-green-500]="newPassword === confirmPassword"
      [class.text-red-500]="newPassword !== confirmPassword"
    >
      <span *ngIf="newPassword === confirmPassword"
        >✓ Las contraseñas coinciden</span
      >
      <span *ngIf="newPassword !== confirmPassword"
        >✗ Las contraseñas no coinciden</span
      >
    </div>

    <!-- Botón -->
    <div class="pt-2">
      <button
        class="btn-primary text-base tracking-wide w-full"
        [disabled]="loading"
        (click)="onSubmit()"
      >
        <span *ngIf="!loading">Restablecer contraseña</span>
        <span *ngIf="loading">Procesando...</span>
      </button>
    </div>

    <!-- Volver -->
    <div class="text-center pt-2">
      <a
        routerLink="/auth/login"
        class="text-text-muted italic text-sm hover:text-primary transition-colors duration-200"
      >
        Volver al inicio de sesión
      </a>
    </div>
  </div>

  <!-- Footer -->
  <div class="w-full max-w-xl flex justify-between items-center mt-16 px-4">
    <span class="text-sm italic text-text-muted">Version 1.0.0</span>
    <a
      href="#"
      class="text-sm italic text-text-muted hover:text-primary transition-colors duration-200"
    >
      ¿Necesito ayuda?
    </a>
  </div>
</div>
