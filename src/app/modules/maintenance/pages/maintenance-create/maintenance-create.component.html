<div class="p-6 max-w-3xl">
  <!-- Header banner -->
  <div class="bg-primary rounded-lg px-6 py-4 mb-6 flex items-center gap-4">
    <button
      type="button"
      (click)="form.reset()"
      class="flex items-center gap-1 text-sm text-primary font-medium bg-white hover:bg-secondary-light px-3 py-1.5 rounded-md transition-colors shrink-0"
    >
      &#10005; Limpiar
    </button>
    <div class="ml-auto text-right">
      <h1 class="text-sm font-semibold text-white">Registrar Mantenimiento</h1>
      <p class="text-sm text-white/60 mt-0.5">
        Complete los datos del mantenimiento realizado
      </p>
    </div>
  </div>

  <!-- Card -->
  <div class="card">
    <!-- Success alert -->
    <div
      *ngIf="successMsg"
      class="flex items-center gap-2 bg-green-50 border border-green-200 text-green-800 rounded-md px-4 py-3 mb-5 text-sm"
    >
      <span class="font-bold">&#10003;</span> {{ successMsg }}
    </div>

    <!-- Error alert -->
    <div
      *ngIf="errorMsg"
      class="flex items-center gap-2 bg-red-50 border border-red-200 text-red-800 rounded-md px-4 py-3 mb-5 text-sm"
    >
      <span class="font-bold">&#9888;</span> {{ errorMsg }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Row 1: Equipment ID + Type -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <div class="flex flex-col gap-1">
          <label
            class="text-xs font-semibold text-text-main tracking-wide"
            for="equipmentId"
          >
            ID del Equipo <span class="text-danger">*</span>
          </label>
          <input
            id="equipmentId"
            type="number"
            formControlName="equipmentId"
            placeholder="Ej: 101"
            [class]="
              isInvalid('equipmentId')
                ? 'input-field border-red-500 focus:ring-red-300'
                : 'input-field'
            "
          />
          <span
            *ngIf="isInvalid('equipmentId')"
            class="text-xs text-red-600 mt-0.5"
          >
            Ingrese un ID de equipo válido.
          </span>
        </div>

        <div class="flex flex-col gap-1">
          <label
            class="text-xs font-semibold text-text-main tracking-wide"
            for="type"
          >
            Tipo de Mantenimiento <span class="text-danger">*</span>
          </label>
          <select
            id="type"
            formControlName="type"
            [class]="
              isInvalid('type')
                ? 'select-field border-red-500 focus:ring-red-300'
                : 'select-field'
            "
          >
            <option value="" disabled>Seleccione un tipo</option>
            <option *ngFor="let t of maintenanceTypes" [value]="t.value">
              {{ t.label }}
            </option>
          </select>
          <span *ngIf="isInvalid('type')" class="text-xs text-red-600 mt-0.5">
            Seleccione el tipo de mantenimiento.
          </span>
        </div>
      </div>

      <!-- Row 2: Date + Technician ID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <div class="flex flex-col gap-1">
          <label
            class="text-xs font-semibold text-text-main tracking-wide"
            for="date"
          >
            Fecha del Mantenimiento <span class="text-danger">*</span>
          </label>
          <input
            id="date"
            type="datetime-local"
            formControlName="date"
            [class]="
              isInvalid('date')
                ? 'input-field border-red-500 focus:ring-red-300'
                : 'input-field'
            "
          />
          <span *ngIf="isInvalid('date')" class="text-xs text-red-600 mt-0.5">
            Seleccione la fecha y hora.
          </span>
        </div>

        <div class="flex flex-col gap-1">
          <label
            class="text-xs font-semibold text-text-main tracking-wide"
            for="technicianId"
          >
            ID del Técnico <span class="text-danger">*</span>
          </label>
          <input
            id="technicianId"
            type="number"
            formControlName="technicianId"
            placeholder="Ej: 5"
            [class]="
              isInvalid('technicianId')
                ? 'input-field border-red-500 focus:ring-red-300'
                : 'input-field'
            "
          />
          <span
            *ngIf="isInvalid('technicianId')"
            class="text-xs text-red-600 mt-0.5"
          >
            Ingrese el ID del técnico responsable.
          </span>
        </div>
      </div>

      <!-- Row 3: Next Maintenance (half width) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
        <div class="flex flex-col gap-1">
          <label
            class="text-xs font-semibold text-text-main tracking-wide"
            for="nextMaintenanceDate"
          >
            Próximo Mantenimiento
            <span class="text-text-muted font-normal">(opcional)</span>
          </label>
          <input
            id="nextMaintenanceDate"
            type="datetime-local"
            formControlName="nextMaintenanceDate"
            class="input-field"
          />
        </div>
      </div>

      <!-- Row 4: Description (full width) -->
      <div class="flex flex-col gap-1 mb-6">
        <label
          class="text-xs font-semibold text-text-main tracking-wide"
          for="description"
        >
          Descripción <span class="text-danger">*</span>
        </label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          placeholder="Describa el trabajo realizado, piezas reemplazadas, observaciones..."
          [class]="
            isInvalid('description')
              ? 'input-field resize-y min-h-[100px] border-red-500 focus:ring-red-300'
              : 'input-field resize-y min-h-[100px]'
          "
        ></textarea>
        <span
          *ngIf="isInvalid('description')"
          class="text-xs text-red-600 mt-0.5"
        >
          La descripción debe tener al menos 5 caracteres.
        </span>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-3 pt-4 border-t border-secondary">
        <button
          type="submit"
          [disabled]="loading"
          class="btn-primary w-auto px-6 py-2 text-sm flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span
            *ngIf="loading"
            class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin inline-block"
          >
          </span>
          {{ loading ? "Guardando..." : "Registrar Mantenimiento" }}
        </button>
      </div>
    </form>
  </div>
</div>
