<div class="max-w-5xl mx-auto">
  <!-- HEADER -->
  <div class="bg-primary px-6 py-4 rounded-lg shadow mb-8">
    <h2 class="text-lg text-white font-semibold">Editar Usuario</h2>
  </div>

  <!-- BUSQUEDA -->
  <div class="grid md:grid-cols-2 gap-4 mt-6">
    <div class="flex gap-2">
      <input
        type="number"
        name="searchId"
        placeholder="Ingrese ID"
        [(ngModel)]="searchId"
        class="input w-full"
      />
      <button type="button" class="btn-primary" (click)="searchById()">
        Buscar
      </button>
    </div>

    <div class="flex gap-2">
      <input
        type="email"
        name="searchEmail"
        placeholder="Ingrese Email"
        [(ngModel)]="searchEmail"
        class="input w-full"
      />
      <button type="button" class="btn-primary" (click)="searchByEmail()">
        Buscar
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-4 text-primary font-medium">
    Cargando usuario...
  </div>

  <!-- FORM -->
  <div class="bg-transparent rounded-xl shadow-lg p-8">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- ROL -->
      <div>
        <label class="block text-sm mb-1">Rol *</label>

        <input
          [value]="currentRoleName"
          class="w-full px-4 py-2 rounded-md border bg-gray-100 text-gray-600 font-medium"
          disabled
        />
      </div>

      <!-- NOMBRE / APELLIDO -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm mb-1">Nombres *</label>
          <input formControlName="firstName" class="input w-full" />

          <div
            *ngIf="
              userForm.get('firstName')?.errors?.['letter'] &&
              userForm.get('firstName')?.touched
            "
            class="text-sm text-red-500 mt-1"
          >
            Solo se permiten letras
          </div>
        </div>

        <div>
          <label class="block text-sm mb-1">Apellidos *</label>
          <input formControlName="lastName" class="input w-full" />

          <div
            *ngIf="
              userForm.get('lastName')?.errors?.['letter'] &&
              userForm.get('lastName')?.touched
            "
            class="text-sm text-red-500 mt-1"
          >
            Solo se permiten letras
          </div>
        </div>
      </div>

      <!-- FECHA / CELULAR -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm mb-1">Fecha de Nacimiento</label>
          <input type="date" formControlName="birthDate" class="input w-full" />
        </div>

        <div>
          <label class="block text-sm mb-1">Celular</label>
          <input formControlName="phone" class="input w-full" />

          <div
            *ngIf="
              userForm.get('phone')?.errors?.['number'] &&
              userForm.get('phone')?.touched
            "
            class="text-sm text-red-500 mt-1"
          >
            Solo se permiten números
          </div>
        </div>
      </div>

      <!-- DOCUMENTO / EMAIL -->
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm mb-1">Cédula / NIT *</label>
          <input formControlName="document" class="input w-full" />

          <div
            *ngIf="
              userForm.get('document')?.errors?.['number'] &&
              userForm.get('document')?.touched
            "
            class="text-sm text-red-500 mt-1"
          >
            Solo se permiten números
          </div>
        </div>

        <div>
          <label class="block text-sm mb-1">Email *</label>
          <input type="email" formControlName="email" class="input w-full" />

          <div
            *ngIf="
              userForm.get('email')?.errors?.['email'] &&
              userForm.get('email')?.touched
            "
            class="text-sm text-red-500 mt-1"
          >
            Email inválido
          </div>
        </div>
      </div>

      <!-- ENTIDAD -->
      <div>
        <label class="block text-sm mb-1">Entidad</label>
        <select formControlName="entity" class="input w-full">
          <option value="">Seleccionar entidad</option>
          <option value="1">SIGEBI</option>
          <option value="2">DRAGONESDEV</option>
          <option value="3">SANITAS</option>
          <option value="4">CLINICAX</option>
        </select>

        <div
          *ngIf="
            userForm.get('entity')?.errors?.['required'] &&
            userForm.get('entity')?.touched
          "
          class="text-sm text-red-500 mt-1"
        >
          Debe seleccionar una entidad
        </div>
      </div>

      <!-- 🔥 BOTONES INTERMEDIOS (NO TOCADOS) -->
      <div class="flex flex-col text-center md:flex-row gap-4 pt-4">
        <button type="button" class="btn-primary md:w-auto">
          Ver Contraseña
        </button>

        <button type="button" class="btn-primary md:w-auto">
          Servicios Asignados
        </button>

        <button type="button" class="btn-primary md:w-auto">
          Grupo de Trabajo
        </button>
      </div>

      <!-- BOTONES FINALES -->
      <div class="flex flex-col md:flex-row justify-between gap-4 pt-8">
        <button
          type="button"
          class="btn-primary"
          [disabled]="loading"
          (click)="toggleUserStatusMethod()"
        >
          {{ isUserActive ? "Bloquear" : "Activar" }}
        </button>

        <button
          type="button"
          class="btn-primary"
          [disabled]="loading"
          (click)="deleteUserHard()"
        >
          Eliminar
        </button>
      </div>

      <!-- ACTUALIZAR -->
      <div class="pt-4 text-center">
        <button type="submit" class="btn-primary" (click)="onSubmit()">
          Actualizar
        </button>
      </div>
    </form>
  </div>
</div>
